<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ustoz — chizib tushuntiradi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2547;--paper:#fbfcff;--grid:#dbe5f8;--marker:#e5484d;--hi:#ffe27a;--sky:#4f7cff;--mute:#6b7699;
  --hand:'Caveat','Segoe Print',cursive;--ui:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);background:var(--paper);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
/* orb */
.orb{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a5a8f,#141b38 70%);box-shadow:0 8px 24px #4f7cff55;flex:none}
.orb::before,.orb::after{content:"";position:absolute;top:26px;width:8px;height:12px;border-radius:50%;background:#fff}
.orb::before{left:18px}.orb::after{right:18px}
.orb i{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--marker)}
.orb.talk{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
/* home */
#home{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;text-align:center}
#home h1{font-size:32px;margin:8px 0 0;font-weight:800}
#home p{margin:0;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.chip{background:#eef3ff;color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px}
.chip:hover{background:var(--hi)}
.ask{width:100%;display:flex;gap:8px;align-items:flex-end;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:8px 8px 8px 14px}
.ask textarea{flex:1;border:0;resize:none;font:inherit;font-size:16px;color:var(--ink);background:transparent;min-height:44px;max-height:120px;outline:0}
.ico{width:44px;height:44px;border-radius:14px;background:#eef3ff;color:var(--ink);font-size:20px;display:grid;place-items:center;flex:none}
.go{background:var(--ink);color:#fff}
#thumb{display:none;flex-wrap:wrap;gap:8px;justify-content:center;max-height:132px;overflow:auto;padding:8px 8px 0}
.th{position:relative}
.th img{height:48px;border-radius:8px;border:2px solid var(--ink);display:block}
.th button{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--marker);color:#fff;font-weight:800;line-height:1;padding:0}
#err{color:var(--marker);font-weight:700;min-height:20px}
/* lesson */
#lesson{display:none;flex:1;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.bar h2{flex:1;margin:0;font-family:var(--hand);font-size:28px;line-height:1}
.bar .ico{width:40px;height:40px;font-size:18px}
#board{position:relative;flex:1;overflow:auto;padding:18px 18px 150px;margin:0 10px;border:2px solid var(--ink);border-radius:18px}
.note{margin:0 0 18px 64px}
.note ul{list-style:none;margin:0;padding:0;font-family:var(--hand);font-size:30px;font-weight:700;line-height:1.15}
.note li{margin:0 0 4px;padding-left:20px;position:relative}
.note li::before{content:"•";position:absolute;left:0;color:var(--marker)}
.note mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit}
.fig{display:block;width:100%;max-width:340px;height:auto;margin-top:8px}
.fig *{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fig [data-c=r]{stroke:var(--marker)}.fig [data-c=b]{stroke:var(--sky)}
.fig text{fill:var(--ink);stroke:none;font-family:var(--hand);font-size:20px;font-weight:700;opacity:0;animation:fade .5s ease forwards}
.fig text[data-c=r]{fill:var(--marker)}.fig text[data-c=b]{fill:var(--sky)}
.fig .s{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease forwards}
.note.done .fig .s{animation:none;stroke-dashoffset:0}
.note.done .fig text{animation:none;opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
#orb{position:absolute;left:8px;top:14px;transition:top .5s ease}
#orb.orb{width:52px;height:52px}
#orb.orb::before,#orb.orb::after{top:21px;width:7px;height:10px}
#orb.orb::before{left:14px}#orb.orb::after{right:14px}
#sub{position:absolute;left:12px;right:12px;bottom:12px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;font-size:16px;line-height:1.35;font-weight:600;z-index:3}
#ctl{display:flex;justify-content:center;align-items:center;gap:14px;padding:12px}
#ctl .ico{width:48px;height:48px}
#play{background:var(--sky);color:#fff;width:56px;height:56px;border-radius:50%}
#cnt{font-weight:800;color:var(--mute);min-width:44px;text-align:center}
#loading{display:none;position:fixed;inset:0;background:#fbfcffee;place-items:center;align-content:center;gap:14px;font-weight:800;z-index:9}
@media (prefers-reduced-motion:reduce){.orb.talk{animation:none}.fig .s{animation:none;stroke-dashoffset:0}.fig text{animation:none;opacity:1}#orb{transition:none}}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="grid">
    <div class="orb"><i></i></div>
    <h1>Nimani oʻrganamiz?</h1>
    <p>Mavzuni yozing yoki istalgancha rasm yuboring. Chizib, ovoz chiqarib tushuntiraman.</p>
    <div id="thumb"></div>
    <div class="ask">
      <label class="ico" title="Rasm yuborish" for="file">📷</label>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <textarea id="q" rows="1" placeholder="Mavzu, savol yoki uy vazifasi..."></textarea>
      <button id="send" class="ico go" type="button" aria-label="Yuborish">➤</button>
    </div>
    <div id="err" role="alert"></div>
    <div class="chips" id="chips"></div>
  </section>

  <section id="lesson">
    <div class="bar">
      <button id="back" class="ico" type="button" aria-label="Orqaga">←</button>
      <h2 id="title"></h2>
    </div>
    <div id="board" class="grid">
      <div id="orb" class="orb"><i></i></div>
      <div id="notes"></div>
      <div id="sub" aria-live="polite"></div>
    </div>
    <div id="ctl">
      <button id="prev" class="ico" type="button" aria-label="Oldingi qadam">⏮</button>
      <button id="play" class="ico" type="button" aria-label="Pauza">⏸</button>
      <button id="next" class="ico" type="button" aria-label="Keyingi qadam">⏭</button>
      <span id="cnt"></span>
    </div>
  </section>
</div>
<div id="loading"><div class="orb talk"><i></i></div><span>Dars tayyorlanmoqda…</span></div>

<script>
const $ = s => document.querySelector(s);
let lesson = null, idx = 0, paused = false, token = 0, imgs = [], cache = {}, audio = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- home ---------- */
["Pifagor teoremasi qanday ishlaydi?", "Oʻsimliklar qanday oziqlanadi?", "Nega osmon moviy?", "y = x² grafigi qanday koʻrinadi?"]
  .forEach(t => { const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = t;
    b.onclick = () => { $("#q").value = t; start(); }; $("#chips").append(b); });

function shrink(f, max, q) {
  return new Promise(ok => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => ok("");
    img.src = url;
  });
}
function drawThumbs() {
  const box = $("#thumb"); box.innerHTML = ""; box.style.display = imgs.length ? "flex" : "none";
  imgs.forEach((f, i) => {
    const w = document.createElement("div"); w.className = "th";
    w.innerHTML = `<img alt="Rasm ${i + 1}" src="${URL.createObjectURL(f)}"><button type="button" aria-label="Olib tashlash">×</button>`;
    w.querySelector("button").onclick = () => { imgs.splice(i, 1); drawThumbs(); };
    box.append(w);
  });
}
$("#file").onchange = e => { imgs.push(...e.target.files); e.target.value = ""; drawThumbs(); };
$("#send").onclick = start;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); start(); } });

async function start() {
  const topic = $("#q").value.trim();
  if (!topic && !imgs.length) { $("#err").textContent = "Mavzu yozing yoki rasm yuboring."; return; }
  $("#err").textContent = ""; $("#loading").style.display = "grid";
  try {
    const n = imgs.length, max = n <= 5 ? 1280 : n <= 10 ? 1024 : n <= 20 ? 800 : 640, q = n <= 10 ? .8 : .7;
    const images = (await Promise.all(imgs.map(f => shrink(f, max, q)))).filter(Boolean);
    const r = await fetch("/api/lesson", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic, images }), signal: AbortSignal.timeout(170000) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    if (d.check) d.steps.push({ say: d.check, points: [d.check], svg: "" });
    lesson = d; cache = {}; $("#title").textContent = d.title;
    await Promise.race([getAudio(0), sleep(25000)]);
    $("#home").style.display = "none"; $("#lesson").style.display = "flex";
    play(0);
  } catch (e) { $("#err").textContent = e.name === "TimeoutError" ? "Javob juda kech keldi. Qayta urinib koʻring." : (e.message || "Xatolik yuz berdi."); }
  $("#loading").style.display = "none";
}

/* ---------- lesson ---------- */
function getAudio(i) {
  if (!lesson || i >= lesson.steps.length) return Promise.resolve(null);
  if (!cache[i]) cache[i] = fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: lesson.steps[i].say }), signal: AbortSignal.timeout(45000) })
    .then(r => r.ok ? r.json() : null)
    .then(d => d && d.audio ? "data:" + (d.mime || "audio/wav") + ";base64," + d.audio : null)
    .catch(() => null);
  return cache[i];
}
function stopAudio() {
  if (audio) { audio.pause(); audio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function synthVoice() {
  const v = speechSynthesis.getVoices();
  return v.find(x => x.lang.startsWith("uz")) || v.find(x => x.lang.startsWith("tr")) || v.find(x => x.lang.startsWith("ru")) || null;
}
const OK = new Set(["line", "path", "circle", "ellipse", "rect", "polygon", "polyline", "text"]);
const AT = new Set(["x", "y", "x1", "y1", "x2", "y2", "cx", "cy", "r", "rx", "ry", "width", "height", "d", "points", "text-anchor", "transform", "data-c"]);
function makeFig(src, ms) {
  if (!src || src.length > 6000) return null;
  const doc = new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">' + src + "</svg>", "image/svg+xml");
  if (doc.querySelector("parsererror")) return null;
  const root = doc.documentElement;
  [...root.children].forEach(c => {
    if (!OK.has(c.localName)) return c.remove();
    [...c.attributes].forEach(a => { if (!AT.has(a.name)) c.removeAttribute(a.name); });
    if (c.localName === "text") c.textContent = c.textContent;
  });
  if (!root.children.length) return null;
  const svg = document.importNode(root, true);
  svg.setAttribute("class", "fig");
  const gap = Math.min(.5, (ms / 1000 * .7) / svg.children.length);
  [...svg.children].forEach((el, i) => {
    el.style.animationDelay = (.3 + i * gap) + "s";
    if (el.localName !== "text") { el.setAttribute("pathLength", "1"); el.classList.add("s"); }
  });
  return svg;
}
function addNote(s, instant, ms) {
  const n = document.createElement("div"); n.className = "note" + (instant ? " done" : "");
  const ul = document.createElement("ul"); n.append(ul);
  const pts = s.points || [];
  const fig = makeFig(s.svg, ms || 3000); if (fig) n.append(fig);
  $("#notes").append(n);
  $("#orb").style.top = n.offsetTop + 4 + "px";
  n.scrollIntoView({ block: "nearest", behavior: "smooth" });
  if (instant) { pts.forEach(p => { const li = document.createElement("li"); li.textContent = p; ul.append(li); }); return; }
  const tk = token, total = pts.join("").length || 1, step = Math.max(25, Math.min(70, (ms * .6) / total));
  (async () => {
    for (const p of pts) {
      const li = document.createElement("li"); ul.append(li);
      for (let c = 1; c <= p.length; c++) { if (tk !== token) return; li.textContent = p.slice(0, c); await sleep(step); }
      await sleep(150);
    }
  })();
}
function play(n) {
  token++; const t = token; idx = n; paused = false; stopAudio();
  $("#play").textContent = "⏸"; $("#play").setAttribute("aria-label", "Pauza");
  $("#notes").innerHTML = "";
  for (let k = 0; k < n; k++) addNote(lesson.steps[k], true);
  const s = lesson.steps[n], last = n + 1 >= lesson.steps.length;
  $("#sub").textContent = s.say;
  $("#cnt").textContent = `${n + 1}/${lesson.steps.length}`;
  let shown = false, ended = false;
  const show = ms => { if (!shown) { shown = true; addNote(s, false, ms); $("#orb").classList.add("talk"); } };
  const fin = () => {
    if (ended || t !== token) return; ended = true;
    $("#orb").classList.remove("talk");
    if (!paused && !last) setTimeout(() => t === token && play(n + 1), 600);
  };
  const synth = () => {
    if (ended || t !== token) return;
    const est = Math.max(2500, s.say.length * 70); show(est);
    if (!("speechSynthesis" in window)) return setTimeout(fin, est);
    const u = new SpeechSynthesisUtterance(s.say), v = synthVoice();
    if (v) u.voice = v;
    u.lang = v ? v.lang : "tr-TR"; u.rate = .95; u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u); setTimeout(fin, est * 2 + 4000);
  };
  show(Math.max(2500, s.say.length * 65));   // doska ovozga bogʻliq emas
  getAudio(n + 1);
  getAudio(n).then(src => {
    if (t !== token) return;
    if (!src) return synth();
    let started = false;
    const a = new Audio(src); audio = a;
    const bail = setTimeout(() => { if (t === token && !started) { a.pause(); synth(); } }, 8000);
    a.onplaying = () => { started = true; clearTimeout(bail); };
    a.onended = fin;
    a.onerror = () => { clearTimeout(bail); synth(); };
    a.play().catch(() => { clearTimeout(bail); synth(); });
  });
}
$("#play").onclick = () => {
  if (!paused) { paused = true; token++; stopAudio(); $("#orb").classList.remove("talk");
    $("#play").textContent = "▶"; $("#play").setAttribute("aria-label", "Davom ettirish"); }
  else play(idx);
};
$("#prev").onclick = () => play(Math.max(0, idx - 1));
$("#next").onclick = () => play(Math.min(lesson.steps.length - 1, idx + 1));
$("#back").onclick = () => { token++; stopAudio(); $("#lesson").style.display = "none"; $("#home").style.display = "flex"; };
if ("speechSynthesis" in window) speechSynthesis.getVoices();
</script>
</body>
</html>
